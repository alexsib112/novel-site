<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovelVerse — веб-новеллы на твоём языке</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Шапка -->
  <header class="topbar">
    <div class="topbar__inner">
      <a class="logo" href="#/catalog">
        <span class="logo__mark">N</span>
        <span class="logo__text">Novel<b>Verse</b></span>
      </a>

      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Поиск новелл и авторов…" autocomplete="off" />
      </div>

      <nav class="topbar__nav">
        <button class="ghost" id="themeToggle" title="Переключить тему">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button class="primary" id="langChip">🌐 RU</button>
      </nav>
    </div>
  </header>

  <!-- Навигация по жанрам -->
  <nav class="genres" id="genresBar"></nav>

  <!-- Контент -->
  <main class="view" id="view"></main>

  <script src="js/data.js"></script>
  <script src="js/novels-extra.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
